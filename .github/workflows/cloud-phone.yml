name: Cloud Phone

# Manual trigger only - nothing runs until you press the button.
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level (30=Android 11 recommended; 24=7, 33, 34)"
        required: true
        default: "30"
      duration_minutes:
        description: "How long to keep the phone alive (minutes, max ~340)"
        required: true
        default: "300"
      target:
        description: "System image. google_apis = root + ARM + Play Services (recommended)"
        required: true
        default: "google_apis"
        type: choice
        options:
          - google_apis
          - google_apis_playstore
          - google_atd
          - aosp_atd
          - default
      magisk:
        description: "Install Magisk (root)? Optional - off by default."
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      arm_translation:
        description: "Use API 30 (ships ARM/libndk translation) for arm64-only APKs?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      resolution:
        description: "Screen size - 540x960 smoothest, 720x1280 sharper, 1080x1920 sharpest"
        required: true
        default: "540x960"
      max_size:
        description: "Stream downscale cap (540 smoothest, 720 sharper)"
        required: true
        default: "540"
      storage:
        description: "Internal storage (/data) size - e.g. 10G, 12G, 16G"
        required: true
        default: "10G"
      restore:
        description: "Restore the newest backup onto a fresh phone at boot?"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      system_apps:
        description: "Extra system apps to back up/restore (space-separated package names)"
        required: true
        default: "com.android.vending com.android.chrome"
      backup_max_mb:
        description: "Max size in MB before /sdcard is dropped from the git fallback (git rejects >100)"
        required: true
        default: "90"

# Needed so the script can push the encrypted backup to the 'backups' branch.
permissions:
  contents: write

jobs:
  cloud-phone:
    runs-on: ubuntu-latest
    # Hard cap for GitHub-hosted jobs is 6 hours; leave a small margin.
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch cloud phone
        env:
          API_LEVEL: ${{ inputs.api_level }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          TARGET: ${{ inputs.target }}
          ARCH: x86_64
          ENABLE_MAGISK: ${{ inputs.magisk == 'yes' && '1' || '0' }}
          MAGISK_VER: "25.2"
          ARM_TRANSLATION: ${{ inputs.arm_translation == 'yes' && '1' || '0' }}
          # Smoothness: smaller screen + a properly-sized emulator.
          # Public-repo runners give 4 vCPU / 16 GB, so use them.
          RESOLUTION: ${{ inputs.resolution }}
          MAX_SIZE: ${{ inputs.max_size }}
          RAM_MB: "4096"
          CORES: "4"
          # Internal storage (/data). Stock AVD gives ~1-2 GB, which is unusable.
          STORAGE: ${{ inputs.storage }}
          RESTORE: ${{ inputs.restore == 'yes' && '1' || '0' }}
          # System apps whose data should survive between sessions
          # (Play Store = your Google sign-in, Chrome = bookmarks/history).
          SYSTEM_APPS: ${{ inputs.system_apps }}
          # Needed to read the latest backup back from the 'backups' branch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add a repo secret named BACKUP_PASSWORD to enable encrypted backups.
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          BACKUP_INTERVAL_MIN: "15"
          BACKUP_MAX_MB: ${{ inputs.backup_max_mb }}
          # Optional. Add a repo secret named PIXELDRAIN_API_KEY and backups go
          # there (no 100 MB limit, so /sdcard files are included) with only a
          # small pointer kept on the 'backups' branch.
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          # ntfy notifications. Add a repo secret named NTFY_TOPIC (your topic).
          # Optional: NTFY_SERVER for a self-hosted ntfy (defaults to ntfy.sh).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER || 'https://ntfy.sh' }}
          NOTIFY_INTERVAL_MIN: "30"
          RESTART_EVERY_MIN: "0"
        run: bash scripts/cloud-phone.sh
