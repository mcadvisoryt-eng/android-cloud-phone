name: Cloud Phone

# Manual trigger only - nothing runs until you press the button.
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level (e.g. 30, 33, 34)"
        required: true
        default: "30"
      duration_minutes:
        description: "How long to keep the phone alive (minutes, max ~340)"
        required: true
        default: "300"
      target:
        description: "System image target"
        required: true
        default: "google_apis"
        type: choice
        options:
          - google_apis
          - google_apis_playstore
          - default

jobs:
  cloud-phone:
    runs-on: ubuntu-latest
    # Hard cap for GitHub-hosted jobs is 6 hours; leave a small margin.
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch cloud phone
        env:
          API_LEVEL: ${{ inputs.api_level }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          TARGET: ${{ inputs.target }}
          ARCH: x86_64
        run: bash scripts/cloud-phone.sh
