name: Cloud Phone

# Manual trigger only - nothing runs until you press the button.
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level (e.g. 30, 33, 34)"
        required: true
        default: "33"
      duration_minutes:
        description: "How long to keep the phone alive (minutes, max ~340)"
        required: true
        default: "300"
      target:
        description: "System image target"
        required: true
        default: "google_apis_playstore"
        type: choice
        options:
          - google_apis_playstore
          - google_apis
          - default
      magisk:
        description: "Try to install Magisk (root)?"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

# Needed so the script can push the encrypted backup to the 'backups' branch.
permissions:
  contents: write

jobs:
  cloud-phone:
    runs-on: ubuntu-latest
    # Hard cap for GitHub-hosted jobs is 6 hours; leave a small margin.
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch cloud phone
        env:
          API_LEVEL: ${{ inputs.api_level }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          TARGET: ${{ inputs.target }}
          ARCH: x86_64
          ENABLE_MAGISK: ${{ inputs.magisk == 'yes' && '1' || '0' }}
          MAGISK_VER: "25.2"
          # Add a repo secret named BACKUP_PASSWORD to enable encrypted backups.
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          BACKUP_INTERVAL_MIN: "15"
        run: bash scripts/cloud-phone.sh
